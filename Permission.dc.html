<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }
    * { box-sizing: border-box; }
    a { color: oklch(0.70 0.15 55); text-decoration: none; }
    a:hover { color: oklch(0.80 0.15 55); }
    @keyframes nudge { 0%, 100% { transform: translateY(0); opacity: 0.9; } 50% { transform: translateY(-6px); opacity: 1; } }
    .nudge { animation: nudge 1.7s ease-in-out infinite; }
  </style>
</helmet>

<div style="width: 560px; height: 780px; background: oklch(0.17 0.008 75); color: oklch(0.94 0.012 85); display: flex; flex-direction: column; position: relative;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid oklch(0.26 0.010 75); opacity: 0.4;">
    <div style="display: flex; align-items: center; gap: 7px;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: oklch(0.70 0.15 55);"></span>
      <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.02em;">echo</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid oklch(0.30 0.012 75); border-radius: 7px; background: oklch(0.21 0.009 75);">
      <span style="font-size: 13px; font-weight: 500;">Russian</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="oklch(0.68 0.014 85)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 11px; padding: 22px 28px 0 28px;">
    <div class="nudge" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-left: 14px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.70 0.15 55)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="5"></line><polyline points="5.5 11.5 12 5 18.5 11.5"></polyline></svg>
    </div>
    <div style="display: flex; gap: 11px; padding: 15px 17px; border: 1px solid oklch(0.34 0.05 55); border-radius: 10px; background: oklch(0.22 0.020 55);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.70 0.15 55)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><rect x="9" y="2" width="6" height="11" rx="3"></rect><path d="M5 10v1a7 7 0 0 0 14 0v-1"></path><line x1="12" y1="18" x2="12" y2="22"></line></svg>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 14px; font-weight: 500;">Your browser is asking permission</div>
        <div style="font-size: 12.5px; line-height: 1.5; color: oklch(0.70 0.014 85); text-wrap: pretty;">Choose <strong style="font-weight: 500; color: oklch(0.92 0.012 85);">Allow</strong> in the prompt near your address bar.</div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 32px; opacity: 0.28;">
    <div style="width: 168px; height: 168px; border-radius: 50%; background: oklch(0.22 0.010 75); border: 1px solid oklch(0.32 0.014 75); display: flex; align-items: center; justify-content: center;">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="oklch(0.62 0.014 85)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"></rect><path d="M5 10v1a7 7 0 0 0 14 0v-1"></path><line x1="12" y1="18" x2="12" y2="22"></line></svg>
    </div>
    <div style="font-size: 21px; font-weight: 500; letter-spacing: -0.01em;">Hold to speak</div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 13px 24px; border-top: 1px solid oklch(0.26 0.010 75); background: oklch(0.155 0.008 75); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; color: oklch(0.58 0.012 85);">
    <div style="display: flex; align-items: center; gap: 7px;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: oklch(0.70 0.15 55);"></span>
      <span>awaiting mic permission</span>
    </div>
    <span>en &#8594; ru</span>
  </div>

</div>
</x-dc>
</body>
</html>
