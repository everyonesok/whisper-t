<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }
    * { box-sizing: border-box; }
    a { color: oklch(0.70 0.15 55); text-decoration: none; }
    a:hover { color: oklch(0.80 0.15 55); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1.1s linear infinite; transform-origin: 50% 50%; }
    @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
    .sweep { animation: sweep 1.6s ease-in-out infinite; }
  </style>
</helmet>

<div style="width: 560px; height: 780px; background: oklch(0.17 0.008 75); color: oklch(0.94 0.012 85); display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid oklch(0.26 0.010 75);">
    <div style="display: flex; align-items: center; gap: 7px;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: oklch(0.70 0.15 55);"></span>
      <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.02em;">echo</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid oklch(0.30 0.012 75); border-radius: 7px; background: oklch(0.21 0.009 75); opacity: 0.45;">
      <span style="font-size: 13px; font-weight: 500;">Russian</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="oklch(0.68 0.014 85)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 30px; padding: 32px 40px;">

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 20px; font-weight: 500; letter-spacing: -0.01em;">Working on it</div>
      <div style="font-size: 13.5px; color: oklch(0.66 0.014 85);">About 9 seconds left</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px;">

      <div style="display: flex; gap: 15px; align-items: flex-start;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 2px;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="oklch(0.70 0.15 155)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke-opacity="0.35"></circle><polyline points="8 12.5 11 15.5 16.5 9"></polyline></svg>
          <div style="width: 1.5px; height: 30px; background: oklch(0.70 0.15 155); opacity: 0.4;"></div>
        </div>
        <div style="display: flex; flex-grow: 1; justify-content: space-between; align-items: baseline; padding-bottom: 22px;">
          <span style="font-size: 15px; color: oklch(0.72 0.014 85);">Understanding what you said</span>
          <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: oklch(0.70 0.15 155);">2.8s</span>
        </div>
      </div>

      <div style="display: flex; gap: 15px; align-items: flex-start;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 2px;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="oklch(0.70 0.15 55)" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle><path class="spin" d="M12 2a10 10 0 0 1 10 10"></path></svg>
          <div style="width: 1.5px; height: 30px; background: oklch(0.30 0.012 75);"></div>
        </div>
        <div style="display: flex; flex-direction: column; flex-grow: 1; gap: 9px; padding-bottom: 22px;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span style="font-size: 15px; font-weight: 500;">Translating to Russian</span>
            <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: oklch(0.62 0.014 85);">1.4s</span>
          </div>
          <div style="height: 3px; border-radius: 2px; background: oklch(0.26 0.010 75); overflow: hidden;">
            <div class="sweep" style="width: 30%; height: 100%; border-radius: 2px; background: oklch(0.70 0.15 55);"></div>
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 15px; align-items: flex-start;">
        <div style="padding-top: 2px;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="oklch(0.42 0.012 75)" stroke-width="2.2"><circle cx="12" cy="12" r="10"></circle></svg>
        </div>
        <div style="display: flex; flex-direction: column; flex-grow: 1; gap: 4px;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span style="font-size: 15px; color: oklch(0.56 0.012 85);">Cloning your voice</span>
            <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: oklch(0.52 0.012 85);">~10s</span>
          </div>
          <span style="font-size: 12.5px; color: oklch(0.52 0.012 85);">This is the slow part &#8212; it runs on your Mac</span>
        </div>
      </div>

    </div>

    <div style="padding: 13px 15px; border-left: 2px solid oklch(0.30 0.012 75); background: oklch(0.195 0.009 75);">
      <div style="font-size: 12.5px; line-height: 1.55; color: oklch(0.62 0.014 85); text-wrap: pretty;">&#8220;um so I was I was thinking maybe we could meet on Tuesday instead&#8221;</div>
    </div>

  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 13px 24px; border-top: 1px solid oklch(0.26 0.010 75); background: oklch(0.155 0.008 75); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; color: oklch(0.58 0.012 85);">
    <div style="display: flex; align-items: center; gap: 7px;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: oklch(0.70 0.15 55);"></span>
      <span>stage 2 of 3</span>
    </div>
    <span>4.2s elapsed</span>
  </div>

</div>
</x-dc>
</body>
</html>
