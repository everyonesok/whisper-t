<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }
    * { box-sizing: border-box; }
    a { color: oklch(0.70 0.15 55); text-decoration: none; }
    a:hover { color: oklch(0.80 0.15 55); }
    @keyframes lvl { 0%, 100% { transform: scaleY(0.22); } 50% { transform: scaleY(1); } }
    .bar { width: 4px; height: 60px; border-radius: 2px; background: oklch(0.70 0.15 55); animation: lvl 0.9s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .rec { animation: pulse 1.4s ease-in-out infinite; }
  </style>
</helmet>

<div style="width: 560px; height: 780px; background: oklch(0.17 0.008 75); color: oklch(0.94 0.012 85); display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid oklch(0.26 0.010 75);">
    <div style="display: flex; align-items: center; gap: 7px;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: oklch(0.70 0.15 55);"></span>
      <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.02em;">echo</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid oklch(0.30 0.012 75); border-radius: 7px; background: oklch(0.21 0.009 75); opacity: 0.45;">
      <span style="font-size: 13px; font-weight: 500;">Russian</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="oklch(0.68 0.014 85)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; padding: 32px;">

    <div style="display: flex; align-items: center; gap: 9px;">
      <span class="rec" style="width: 9px; height: 9px; border-radius: 50%; background: oklch(0.65 0.18 25);"></span>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; font-weight: 500; color: oklch(0.65 0.18 25); letter-spacing: 0.04em;">RECORDING</span>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 5px; height: 76px;">
      <div class="bar" style="animation-delay: 0s; height: 26px;"></div>
      <div class="bar" style="animation-delay: 0.12s; height: 44px;"></div>
      <div class="bar" style="animation-delay: 0.25s; height: 68px;"></div>
      <div class="bar" style="animation-delay: 0.05s; height: 52px;"></div>
      <div class="bar" style="animation-delay: 0.33s; height: 76px;"></div>
      <div class="bar" style="animation-delay: 0.18s; height: 58px;"></div>
      <div class="bar" style="animation-delay: 0.41s; height: 38px;"></div>
      <div class="bar" style="animation-delay: 0.09s; height: 62px;"></div>
      <div class="bar" style="animation-delay: 0.29s; height: 46px;"></div>
      <div class="bar" style="animation-delay: 0.15s; height: 30px;"></div>
    </div>

    <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 34px; font-weight: 400; letter-spacing: -0.01em;">0:04</div>

    <div style="width: 100%; max-width: 392px; display: flex; flex-direction: column; gap: 11px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span style="font-size: 13px; font-weight: 500; color: oklch(0.70 0.15 155);">Good length</span>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: oklch(0.62 0.014 85);">~12s wait</span>
      </div>

      <div style="display: flex; gap: 3px; height: 7px;">
        <div style="flex-grow: 3; background: oklch(0.70 0.15 155); border-radius: 3px 0 0 3px;"></div>
        <div style="flex-grow: 1; background: oklch(0.70 0.15 155); opacity: 0.3;"></div>
        <div style="flex-grow: 3; background: oklch(0.30 0.012 75);"></div>
        <div style="flex-grow: 3; background: oklch(0.26 0.010 75); border-radius: 0 3px 3px 0;"></div>
      </div>

      <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px; color: oklch(0.52 0.012 85);">
        <span>SHORT</span>
        <span>LONG</span>
        <span>VERY LONG</span>
      </div>
    </div>

    <div style="font-size: 14px; color: oklch(0.68 0.014 85);">Release to translate</div>

  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 13px 24px; border-top: 1px solid oklch(0.26 0.010 75); background: oklch(0.155 0.008 75); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; color: oklch(0.58 0.012 85);">
    <div style="display: flex; align-items: center; gap: 7px;">
      <span class="rec" style="width: 6px; height: 6px; border-radius: 50%; background: oklch(0.65 0.18 25);"></span>
      <span>capturing &#183; 48kHz mono</span>
    </div>
    <span>en &#8594; ru</span>
  </div>

</div>
</x-dc>
</body>
</html>
