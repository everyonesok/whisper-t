<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }
    * { box-sizing: border-box; }
    a { color: oklch(0.70 0.15 55); text-decoration: none; }
    a:hover { color: oklch(0.80 0.15 55); }
    .wv { width: 3px; border-radius: 2px; background: oklch(0.70 0.15 55); }
    .wv-off { width: 3px; border-radius: 2px; background: oklch(0.34 0.012 75); }
  </style>
</helmet>

<div style="width: 560px; height: 780px; background: oklch(0.17 0.008 75); color: oklch(0.94 0.012 85); display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid oklch(0.26 0.010 75);">
    <div style="display: flex; align-items: center; gap: 7px;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: oklch(0.70 0.15 55);"></span>
      <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.02em;">echo</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid oklch(0.30 0.012 75); border-radius: 7px; background: oklch(0.21 0.009 75);">
      <span style="font-size: 13px; font-weight: 500;">Russian</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="oklch(0.68 0.014 85)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 26px 24px; overflow: hidden;">

    <div style="display: flex; align-items: center; gap: 16px; padding: 17px 19px; border: 1px solid oklch(0.30 0.012 75); border-radius: 11px; background: oklch(0.215 0.010 75);">
      <div style="width: 46px; height: 46px; border-radius: 50%; background: oklch(0.70 0.15 55); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="oklch(0.17 0.008 75)" stroke="none" style="margin-left: 3px;"><polygon points="6 4 20 12 6 20"></polygon></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 3px; height: 40px; flex-grow: 1;">
        <div class="wv" style="height: 12px;"></div><div class="wv" style="height: 22px;"></div><div class="wv" style="height: 34px;"></div><div class="wv" style="height: 26px;"></div><div class="wv" style="height: 40px;"></div><div class="wv" style="height: 30px;"></div><div class="wv" style="height: 18px;"></div><div class="wv" style="height: 28px;"></div>
        <div class="wv-off" style="height: 36px;"></div><div class="wv-off" style="height: 24px;"></div><div class="wv-off" style="height: 32px;"></div><div class="wv-off" style="height: 16px;"></div><div class="wv-off" style="height: 26px;"></div><div class="wv-off" style="height: 38px;"></div><div class="wv-off" style="height: 20px;"></div><div class="wv-off" style="height: 30px;"></div><div class="wv-off" style="height: 14px;"></div><div class="wv-off" style="height: 24px;"></div><div class="wv-off" style="height: 34px;"></div><div class="wv-off" style="height: 18px;"></div>
      </div>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: oklch(0.62 0.014 85); flex-shrink: 0;">0:03</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px; letter-spacing: 0.08em; color: oklch(0.56 0.012 85);">HEARD</span>
        <span style="font-size: 12px; color: oklch(0.70 0.15 55); border-bottom: 1px solid oklch(0.70 0.15 55); padding-bottom: 1px;">Not what you said?</span>
      </div>
      <div style="font-size: 14.5px; line-height: 1.55; color: oklch(0.70 0.014 85); text-wrap: pretty;">um so I was I was thinking maybe we could meet on Tuesday instead</div>
    </div>

    <div style="height: 1px; background: oklch(0.26 0.010 75);"></div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px; letter-spacing: 0.08em; color: oklch(0.56 0.012 85);">RUSSIAN</span>
      <div style="font-size: 20px; line-height: 1.45; font-weight: 500; letter-spacing: -0.01em; text-wrap: pretty;">&#1071; &#1090;&#1091;&#1090; &#1087;&#1086;&#1076;&#1091;&#1084;&#1072;&#1083;, &#1084;&#1086;&#1078;&#1077;&#1090;, &#1074;&#1089;&#1090;&#1088;&#1077;&#1090;&#1080;&#1084;&#1089;&#1103; &#1083;&#1091;&#1095;&#1096;&#1077; &#1074;&#1086; &#1074;&#1090;&#1086;&#1088;&#1085;&#1080;&#1082;?</div>
    </div>

    <div style="flex-grow: 1;"></div>

    <div style="display: flex; gap: 3px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px;">
      <div style="flex-grow: 28; display: flex; flex-direction: column; gap: 5px;">
        <div style="height: 3px; background: oklch(0.70 0.15 155); border-radius: 2px 0 0 2px;"></div>
        <span style="color: oklch(0.54 0.012 85);">heard 2.8s</span>
      </div>
      <div style="flex-grow: 24; display: flex; flex-direction: column; gap: 5px;">
        <div style="height: 3px; background: oklch(0.70 0.15 200);"></div>
        <span style="color: oklch(0.54 0.012 85);">translated 2.4s</span>
      </div>
      <div style="flex-grow: 96; display: flex; flex-direction: column; gap: 5px;">
        <div style="height: 3px; background: oklch(0.70 0.15 55); border-radius: 0 2px 2px 0;"></div>
        <span style="color: oklch(0.54 0.012 85);">voice 9.6s</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; padding: 10px 13px; border: 1px solid oklch(0.28 0.012 75); border-radius: 8px; background: oklch(0.195 0.009 75);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="oklch(0.58 0.012 85)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; color: oklch(0.56 0.012 85);">saves as</span>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; color: oklch(0.82 0.012 85);">meet-on-tuesday-ru.wav</span>
    </div>

    <div style="display: flex; gap: 10px;">
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 9px; padding: 14px; border-radius: 9px; background: oklch(0.70 0.15 55); color: oklch(0.17 0.008 75);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="oklch(0.17 0.008 75)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"></rect><path d="M5 10v1a7 7 0 0 0 14 0v-1"></path><line x1="12" y1="18" x2="12" y2="22"></line></svg>
        <span style="font-size: 14.5px; font-weight: 500;">Say something else</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 16px; border: 1px solid oklch(0.42 0.05 55); border-radius: 9px; background: oklch(0.24 0.022 55);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.78 0.13 55)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>

      </div>
      <div style="display: flex; align-items: center; justify-content: center; padding: 14px 16px; border: 1px solid oklch(0.32 0.014 75); border-radius: 9px; background: oklch(0.21 0.009 75);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="oklch(0.80 0.014 85)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.5 15a9 9 0 1 0 2.1-9.4L1 10"></path></svg>
      </div>
    </div>

  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 13px 24px; border-top: 1px solid oklch(0.26 0.010 75); background: oklch(0.155 0.008 75); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; color: oklch(0.58 0.012 85);">
    <div style="display: flex; align-items: center; gap: 7px;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: oklch(0.70 0.15 155);"></span>
      <span>done in 14.8s</span>
    </div>
    <span>$0.0015 &#183; opus-5</span>
  </div>

</div>
</x-dc>
