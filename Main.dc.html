<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }
    * { box-sizing: border-box; }
    a { color: oklch(0.70 0.15 55); text-decoration: none; }
    a:hover { color: oklch(0.80 0.15 55); }
  </style>
</helmet>

<div style="width: 560px; height: 780px; background: oklch(0.17 0.008 75); color: oklch(0.94 0.012 85); display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid oklch(0.26 0.010 75);">
    <div style="display: flex; align-items: center; gap: 7px;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: oklch(0.70 0.15 55);"></span>
      <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.02em;">echo</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid oklch(0.30 0.012 75); border-radius: 7px; background: oklch(0.21 0.009 75);">
      <span style="font-size: 13px; font-weight: 500;">Russian</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="oklch(0.68 0.014 85)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; padding: 32px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 22px;">
      <div style="width: 168px; height: 168px; border-radius: 50%; background: oklch(0.22 0.010 75); border: 1px solid oklch(0.32 0.014 75); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 oklch(0.38 0.014 75), 0 18px 40px -18px oklch(0.10 0.006 75);">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="oklch(0.70 0.15 55)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="11" rx="3"></rect>
          <path d="M5 10v1a7 7 0 0 0 14 0v-1"></path>
          <line x1="12" y1="18" x2="12" y2="22"></line>
        </svg>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
        <div style="font-size: 21px; font-weight: 500; letter-spacing: -0.01em;">Hold to speak</div>
        <div style="font-size: 13px; color: oklch(0.66 0.014 85);">Release when you're done</div>
      </div>
    </div>

    <div style="width: 100%; max-width: 380px; display: flex; gap: 12px; padding: 14px 16px; border: 1px solid oklch(0.28 0.012 75); border-radius: 9px; background: oklch(0.195 0.009 75);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="oklch(0.70 0.15 55)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;">
        <circle cx="12" cy="12" r="9"></circle>
        <line x1="12" y1="16" x2="12" y2="11"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 13.5px; font-weight: 500;">One sentence at a time</div>
        <div style="font-size: 12.5px; line-height: 1.5; color: oklch(0.66 0.014 85); text-wrap: pretty;">A short sentence takes about 12 seconds. A long paragraph can take over a minute.</div>
      </div>
    </div>

  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 13px 24px; border-top: 1px solid oklch(0.26 0.010 75); background: oklch(0.155 0.008 75); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; color: oklch(0.58 0.012 85);">
    <div style="display: flex; align-items: center; gap: 7px;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: oklch(0.70 0.15 155);"></span>
      <span>ready</span>
    </div>
    <span>en &#8594; ru &#183; voice: reference.wav</span>
  </div>

</div>
</x-dc>
</body>
</html>
